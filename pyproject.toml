[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dungshovel"
dynamic = ["version"]
description = "Audit Apache ZooKeeper servers: enumerate znodes, fingerprint servers and applications, list clients"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["kazoo>=2.9", "rich>=13"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
dungshovel = "dungshovel.cli:main"

[tool.setuptools]
packages = ["dungshovel"]

[tool.setuptools.dynamic]
version = { attr = "dungshovel.__version__" }
